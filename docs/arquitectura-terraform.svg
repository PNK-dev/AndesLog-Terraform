<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AndesLog: diseño Multi-AZ e integración ERP a Azure</title>
  <desc id="desc">El ALB distribuye el ERP a dos nodos privados en AWS y RDS PostgreSQL Multi-AZ. El ERP envía eventos por HTTPS con HMAC a Azure Function; esta usa identidad administrada y Private Endpoint para guardarlos en Blob ZRS privado. Azure Files primario en Chile Central tiene copia regional en Mexico Central con Private Endpoint y peering global. La recuperación regional no está demostrada y no hay VPN Site-to-Site AWS-Azure en AWS Academy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.cloudtitle{font-size:22px;font-weight:700}.cloudsub{font-size:13px;fill:#64748b}.cardtitle{font-size:16px;font-weight:700}.body{font-size:13px;fill:#334155}.small{font-size:11px;fill:#475569}.pill{font-size:11px;font-weight:700}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.tunnel{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrow-purple)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">AndesLog · arquitectura multicloud Multi-AZ</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Diseño Terraform · Multi-AZ y copia regional manual de Azure Files · despliegue académico de laboratorio</text>

  <!-- User connections, drawn behind resource cards -->
  <path d="M225 265H282" class="line"/>
  <path d="M1190 150V310" class="line"/>
  <path d="M820 802H970" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>


  <path d="M1080 405V435" class="line"/><path d="M1332 405V435" class="line"/>
  <path d="M1190 482H1220" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M485 365V410" class="line"/>
  <path d="M485 520V565" class="line"/>
  <path d="M435 520V565" class="line"/><path d="M695 520V565" class="line"/>
  <path d="M770 365V410" class="line"/><path d="M1332 529V555" class="line"/>
  <path d="M770 520V565" class="line"/>

  <!-- External entry -->
  <rect x="25" y="220" width="200" height="90" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="252" text-anchor="middle" class="cardtitle">Usuarios web</text>
  <text x="125" y="275" text-anchor="middle" class="body">HTTP 80 (laboratorio)</text>
  <text x="125" y="294" text-anchor="middle" class="small">HTTPS opcional con ACM</text>

  <rect x="1030" y="95" width="320" height="55" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1190" y="119" text-anchor="middle" class="cardtitle">Usuarios Windows remotos</text>
  <text x="1190" y="139" text-anchor="middle" class="small">Azure VPN Client · Microsoft Entra ID</text>

  <!-- AWS region -->
  <rect x="260" y="120" width="600" height="785" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="292" y="160" class="cloudtitle">AWS · us-east-1</text>
  <text x="292" y="182" class="cloudsub">VPC 10.10.0.0/16 · dos Availability Zones</text>
  <rect x="282" y="200" width="556" height="665" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="227" class="small">VPC AndesLog</text>

  <rect x="370" y="245" width="350" height="105" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="545" y="274" text-anchor="middle" class="cardtitle">Application Load Balancer</text>
  <text x="545" y="298" text-anchor="middle" class="body">público en AZ-a y AZ-b</text>
  <text x="545" y="322" text-anchor="middle" class="small">Health check · /api/health/live</text>

  <text x="420" y="393" text-anchor="middle" class="pill" fill="#9a3412">SUBRED PRIVADA · AZ-a</text>
  <rect x="300" y="410" width="270" height="110" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="435" y="442" text-anchor="middle" class="cardtitle">ASG · ERP Docker</text>
  <text x="435" y="466" text-anchor="middle" class="body">Nodo 1 · reemplazo automático</text>
  <text x="435" y="492" text-anchor="middle" class="small">ECR privado · Secret Manager</text>

  <text x="715" y="393" text-anchor="middle" class="pill" fill="#9a3412">SUBRED PRIVADA · AZ-b</text>
  <rect x="580" y="410" width="230" height="110" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="695" y="442" text-anchor="middle" class="cardtitle">ASG · ERP Docker</text>
  <text x="695" y="466" text-anchor="middle" class="body">Nodo 2 · zona distinta</text>
  <text x="695" y="492" text-anchor="middle" class="small">mínimo 2 · máximo 3</text>

  <rect x="300" y="665" width="245" height="74" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="422" y="694" text-anchor="middle" class="cardtitle">NAT Gateway · AZ-a</text>
  <text x="422" y="718" text-anchor="middle" class="small">Salida privada resiliente</text>
  <rect x="565" y="665" width="245" height="74" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="687" y="694" text-anchor="middle" class="cardtitle">NAT Gateway · AZ-b</text>
  <text x="687" y="718" text-anchor="middle" class="small">Cargo horario por cada uno</text>

  <rect x="300" y="565" width="510" height="66" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="555" y="592" text-anchor="middle" class="cardtitle">Amazon RDS PostgreSQL · Multi-AZ</text>
  <text x="555" y="615" text-anchor="middle" class="small">Primario + standby administrado · privado · gp3 cifrado</text>

  <rect x="570" y="765" width="250" height="74" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="695" y="794" text-anchor="middle" class="cardtitle">ERP · outbox + worker</text>
  <text x="695" y="818" text-anchor="middle" class="small">evento durable en PostgreSQL</text>

  <!-- Azure region -->
  <rect x="920" y="190" width="575" height="715" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="952" y="230" class="cloudtitle">Azure · Chile Central / Mexico Central / West US 2</text>
  <text x="952" y="252" class="cloudsub">VPN/Files primarios, Files DR y Function/Blob en red separada</text>
  <rect x="942" y="270" width="531" height="595" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="960" y="297" class="small">Resource Group · VNet corporativa</text>

  <rect x="970" y="315" width="475" height="90" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1207" y="346" text-anchor="middle" class="cardtitle">Azure VPN Gateway · VpnGw1AZ</text>
  <text x="1207" y="370" text-anchor="middle" class="body">Activo-activo · VPN P2S de usuarios</text>
  <text x="1207" y="391" text-anchor="middle" class="small">Microsoft Entra · sin S2S AWS en esta cuenta</text>

  <rect x="970" y="435" width="220" height="94" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1080" y="466" text-anchor="middle" class="cardtitle">Private DNS Resolver</text>
  <text x="1080" y="490" text-anchor="middle" class="body">Inbound · 10.20.254.4</text>
  <text x="1080" y="513" text-anchor="middle" class="small">Nombre privado para clientes</text>

  <rect x="1220" y="435" width="225" height="94" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="1332" y="466" text-anchor="middle" class="cardtitle">Private Endpoints · 3</text>
  <text x="1332" y="490" text-anchor="middle" class="body">Files primario + Files DR + Blob</text>
  <text x="1332" y="513" text-anchor="middle" class="small">SMB/HTTPS · acceso privado</text>

  <rect x="970" y="555" width="220" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1080" y="580" text-anchor="middle" class="cardtitle">Azure Files · primario</text>
  <text x="1080" y="603" text-anchor="middle" class="body">Chile Central · ZRS</text>
  <text x="1080" y="626" text-anchor="middle" class="small">share andeslog · privado</text>

  <rect x="1200" y="555" width="245" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1322" y="580" text-anchor="middle" class="cardtitle">Azure Files · DR</text>
  <text x="1322" y="603" text-anchor="middle" class="body">Mexico Central · ZRS</text>
  <text x="1322" y="626" text-anchor="middle" class="small">share privado · copia regional</text>
  <text x="1207" y="662" text-anchor="middle" class="small">VNet peering global · DNS privado · Function FileREST/OAuth</text>

  <rect x="970" y="675" width="225" height="66" rx="12" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
  <text x="1082" y="703" text-anchor="middle" class="cardtitle">Blob backups · ZRS</text>
  <text x="1082" y="726" text-anchor="middle" class="small">contenedor privado</text>

  <rect x="1220" y="675" width="225" height="66" rx="12" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
  <text x="1332" y="703" text-anchor="middle" class="cardtitle">Blob eventos · ZRS</text>
  <text x="1332" y="726" text-anchor="middle" class="small">red pública off · PE privado</text>

  <rect x="970" y="765" width="475" height="74" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1207" y="794" text-anchor="middle" class="cardtitle">Azure Function Flex · 2 instancias always-ready</text>
  <text x="1207" y="818" text-anchor="middle" class="small">HTTPS/HMAC público · Managed Identity escribe Blob por PE</text>
  <path d="M1445 480H1460V708H1445" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1207 765V742" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="895" y="792" text-anchor="middle" class="small">HTTPS/HMAC</text>

  <!-- Intercloud label and state -->
  <rect x="540" y="870" width="520" height="44" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="800" y="898" text-anchor="middle" class="body">HTTPS/HMAC ERP → Azure · sin túnel S2S ni ruta privada entre nubes</text>
  <rect x="505" y="940" width="590" height="75" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="972" text-anchor="middle" class="cardtitle">HCP Terraform · estado remoto</text>
  <text x="800" y="995" text-anchor="middle" class="small">andeslog-lab-aws · andeslog-lab-azure · ejecución local CLI</text>
