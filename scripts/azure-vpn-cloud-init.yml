#cloud-config
package_update: true
packages:
  - wireguard
  - iptables
write_files:
  - path: /etc/sysctl.d/99-andeslog-forwarding.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.ip_forward=1
runcmd:
  - [sysctl, --system]
  - [install, -d, -o, root, -g, root, -m, "0700", /etc/wireguard]
  - [sh, -c, "echo 'WireGuard is installed. Generate peer keys and configure wg0 through the documented post-deploy procedure.' > /var/log/andeslog-vpn-setup.txt"]
